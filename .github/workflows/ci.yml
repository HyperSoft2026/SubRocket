name: SubRocket CI
on:
  push:
    branches: [main, "release/v0.0.4"]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: node --check index.js
      - run: node --check features-v3.js
      - run: node --check platform-v4.js
      - run: node --check campaign-engine.js
      - run: node --check platform-workers.js
      - run: node --check reward-center.js
      - run: npm test
